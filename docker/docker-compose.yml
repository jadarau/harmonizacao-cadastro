
services:
  mongodb:
    image: mongo:7.0
    container_name: harmonizacao_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
      MONGO_INITDB_DATABASE: harmonizacao
    volumes:
      - C:/projects/db/harmonizacao:/data/db
      - ./init-scripts:/docker-entrypoint-initdb.d:ro
    networks:
      - harmonizacao_network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  harmonizacao_cadastro_app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: harmonizacao_api_cadastro
    restart: unless-stopped
    ports:
      - "8002:8002"
    environment:
      - MONGODB_URL=mongodb://admin:admin123@mongodb:27017/harmonizacao?authSource=admin
      - MONGODB_DATABASE=harmonizacao
      - MONGODB_COLLECTION_CLIENTES=clientes
      - GROQ_API_KEY=${GROQ_API_KEY}
      - KAFKA_ENABLED=true
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - KAFKA_TOPIC_CLIENTE=clientes
    depends_on:
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - harmonizacao_network
    volumes:
      - ../app:/app/app:ro
  
  kafka:
    image: redpandadata/redpanda:latest
    container_name: harmonizacao_kafka
    command:
      - redpanda start --overprovisioned --smp 1 --memory 512M --reserve-memory 0M --node-id 0
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://kafka:9092,external://localhost:19092
      - --rpc-addr 0.0.0.0:33145
      - --advertise-rpc-addr kafka:33145
    ports:
      - "9092:9092"
      - "19092:19092"
      - "9644:9644"
    networks:
      - harmonizacao_network

networks:
  harmonizacao_network:
    driver: bridge